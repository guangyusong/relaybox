name: Feature Request
description: Suggest an improvement for the OSS Relaybox core.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Relaybox do instead?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: OSS boundary
      description: Explain why this belongs in the open-source core rather than the hosted SaaS layer.
